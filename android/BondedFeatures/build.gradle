// Everything on Android that doesn't touch Nitro, as ios/BondedFeatures is on iOS (docs/architecture.md).
// This build exists to test and check those sources on the JVM, without an app. Apps never run it: the Nitro
// module compiles the same sources into itself (../build.gradle), because React Native's autolinking includes
// one Gradle project per package.
buildscript {
  // Kotlin and the Android Gradle plugin follow React Native 0.88, so code that compiles here compiles in an app.
  ext.BondedFeatures = [
    kotlinVersion: "2.2.0",
    agpVersion: "9.2.1",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36,
    coroutinesVersion: "1.10.2",
  ]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:${BondedFeatures.agpVersion}"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${BondedFeatures.kotlinVersion}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Exact versions only, so every build resolves the same dependencies.
configurations.configureEach {
  resolutionStrategy {
    failOnDynamicVersions()
    failOnChangingVersions()
  }
}

android {
  namespace "com.margelo.nitro.blebonded.features"

  compileSdkVersion BondedFeatures.compileSdkVersion

  defaultConfig {
    minSdkVersion BondedFeatures.minSdkVersion
    targetSdkVersion BondedFeatures.targetSdkVersion
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  // JVM tests are Kotest specs on the JUnit Platform. Android's stubs return defaults instead of throwing, so
  // code that only reads Android constants runs on the JVM.
  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.all {
      it.useJUnitPlatform()
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

// A failing architecture test lists its violations in the console, and reruns when any source changes.
tasks.withType(Test).configureEach {
  testLogging.exceptionFormat = "full"
  testLogging.events "passed", "failed"
  inputs.dir("src").withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${BondedFeatures.coroutinesVersion}"

  testImplementation "io.kotest:kotest-runner-junit5:6.2.6"
  testImplementation "io.kotest:kotest-assertions-core:6.2.6"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
  testImplementation "com.lemonappdev:konsist:0.18.1"

  androidTestImplementation "androidx.test.ext:junit:1.3.0"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "org.jetbrains.kotlin:kotlin-test:${BondedFeatures.kotlinVersion}"
}
