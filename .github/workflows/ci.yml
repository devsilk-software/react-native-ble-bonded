name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, lint, Jest, behaviours
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint-ci
      - run: yarn test --ci
      - run: yarn check:behaviours
      - name: Generated Nitro code is up to date
        run: yarn nitrogen && git diff --exit-code -- nitrogen Package.swift

  ios-features:
    name: Swift tests (BondedFeatures)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/BondedFeatures

  android-features:
    name: Kotlin tests (BondedFeatures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
        working-directory: android/BondedFeatures

  android-example:
    name: Android example app builds
    runs-on: ubuntu-latest
    needs: [typescript, android-features]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: yarn install --immutable
      - run: npx expo prebuild --platform android --clean --no-install
        working-directory: example
        env:
          CI: 1
      - run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" --console=plain
        working-directory: example/android

  # The iOS example app isn't built yet: Nitro v1 builds only through Swift Package Manager, and Expo apps use
  # CocoaPods until margelo/nitro#2054 lands. Add an `ios-example` job here when it does.
