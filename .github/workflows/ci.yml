name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, lint, Jest, behaviours
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint-ci
      - run: yarn test --ci
      - run: yarn check:behaviours
      - name: Generated Nitro code is up to date
        run: yarn nitrogen && git diff --exit-code -- nitrogen Package.swift

  ios-features:
    name: Swift tests (BondedFeatures)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/BondedFeatures

  android-features:
    name: Kotlin tests (BondedFeatures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
        working-directory: android/BondedFeatures

  android-example:
    name: Android example app builds
    runs-on: ubuntu-latest
    needs: [typescript, android-features]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: yarn install --immutable
      - run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --console=plain
        working-directory: example/android

  # Builds through Swift Package Manager (Nitro v1 has no CocoaPods support). macOS minutes are expensive while
  # the repository is private, so this runs on pushes to master and on demand, not on pull requests.
  ios-example:
    name: iOS example app builds
    # Nitro v1 needs Swift tools 6.4 (Xcode 27), which only GitHub's xcode-27 image has; macos-26 stops at Xcode 26.6.
    # When no xcode-27 runner picks the job up, ci-retry.yml re-runs it.
    runs-on: xcode-27
    if: github.event_name != 'pull_request'
    needs: [typescript, ios-features]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn spm --yes
        working-directory: example
      - run: >
          xcodebuild build -project BondedExample.xcodeproj -scheme BondedExample -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
        working-directory: example/ios
